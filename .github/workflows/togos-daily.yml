# Collect candidates, publish the default Summary state, and deploy every day.

name: Run LOKEN Daily

on:
  workflow_dispatch:
  schedule:
    # Run once daily at 01:00 UTC (09:00 Asia/Shanghai).
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: arxiv-paper-collection
  cancel-in-progress: false

jobs:
  collect:
    name: collect-and-publish-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Collect candidates and generate the site
        run: python -m papers.collector

      - name: Commit candidate pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arxiv-candidates.json
          git add docs/togos-papers.json docs/index.html docs/search-index.json
          git add docs/writings
          if git diff --cached --quiet; then
            echo "No candidate updates"
          else
            git commit -m "GitHub Action Collect LOKEN Papers"
            git push origin main
          fi
