paper_labels:
- name: Image Gen&Edit
  description: Image synthesis, text-to-image, image editing, personalization, controllable generation, diffusion,
    flow-matching, or autoregressive image generation methods.
  aliases:
  - Image Generation
- name: Video Gen&Edit
  description: Video synthesis, text-to-video, image-to-video, video editing, animation, or generative audio-video
    methods.
  aliases:
  - Video Generation
- name: 3D Gen&Recon
  description: Generation, reconstruction or editing of 3D/4D objects, shapes, humans, assets, scenes, meshes or
    CAD. Includes single-view and multi-view reconstruction, structure from motion, surface reconstruction, neural
    rendering, novel-view synthesis, NeRF, Gaussian Splatting, radiance fields and differentiable rendering.
  aliases:
  - 3D Generation
  - Neural Rendering
- name: World Model
  description: Learned generative or predictive models of environments, physical dynamics, interactive worlds, or
    action-conditioned future states.
  aliases: []
- name: Relighting
  description: Estimating, transferring, editing, or generating illumination, reflectance, shadows, or appearance
    under novel lighting.
  aliases: []
- name: Depth Estimation
  description: Monocular, stereo, multi-view, metric, relative, or completed depth estimation and prediction.
  aliases: []
