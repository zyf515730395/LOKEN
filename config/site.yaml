paper_tag_groups:
  method:
  - name: Diffusion
    description: Denoising or score-based diffusion is a central method; not merely a baseline.
  - name: Flow Matching
    description: Flow matching or rectified flow, including continuous flow generation.
  - name: Autoregressive
    description: Sequential next-token, next-scale or next-frame generation; may coexist with diffusion.
  - name: Masked Modeling
    description: Masked token prediction or iterative masked generation is a central method.
  - name: GAN
    description: Adversarial generator/discriminator training is a central method.
  - name: VAE
    description: Variational latent-variable learning is a central contribution, not only a frozen tokenizer.
  - name: Consistency Model
    description: Consistency training or distillation enables few-step generation.
  - name: Score Distillation
    description: SDS, VSD or related diffusion-prior optimization for generation or reconstruction.
  - name: Inverse Rendering
    description: Explicit recovery of scene geometry, materials or lighting through image formation.
  - name: Differentiable Rendering
    description: Differentiable image formation is a central optimization mechanism.
  - name: Direct Regression
    description: Direct discriminative depth or geometry regression, rather than sampling a generative model.
  - name: Geometric Matching
    description: Stereo/multi-view correspondence, cost-volume matching or triangulation.
  - name: Latent Dynamics
    description: Learned transitions in a latent environment state for prediction or planning.
  - name: Joint Embedding Prediction
    description: Predicting target representations in embedding space, e.g. JEPA.
  task:
  - name: Relighting
    description: Changing illumination of a scene or subject while preserving its content.
  - name: Depth Estimation
    description: Predicting, completing or refining metric/relative depth or stereo disparity.
  - name: Neural Rendering
    description: Rendering novel views using learned scene representations.
  - name: 3D Reconstruction
    description: Recovering 3D/4D geometry or scenes from observations.
  representation:
  - name: NeRF
    description: Neural radiance field representation.
  - name: Gaussian Splatting
    description: Explicit 2D/3D/4D Gaussian or Gaussian surfel representation.
  - name: Mesh
    description: Explicit triangle/polygon mesh or CAD surface representation.
  - name: Point Cloud
    description: Explicit point-set representation.
  - name: Implicit Field
    description: Implicit occupancy, signed distance or other continuous neural field.
  - name: Discrete Tokens
    description: Discrete visual tokens or codebook representation is central.
  - name: Continuous Latents
    description: A continuous latent representation is central to the method.
