paper_tag_groups:
  method:
  - name: Diffusion
    description: Denoising or score-based diffusion is a central generation mechanism.
  - name: Flow Matching
    description: Flow matching or rectified flow is a central generation mechanism.
  - name: Autoregressive
    description: Sequential next-token, next-scale or next-frame prediction is central.
  - name: GAN
    description: Adversarial generator and discriminator training is central.
  - name: State-Space/Recurrent
    description: Recurrent or state-space transitions form the core world-model dynamics.
  - name: Transformer
    description: Transformer sequence modeling forms the core world-model methodology.
  - name: Physics-Informed/Structured
    description: Explicit physical laws, entities or relational structure constrain the model.
  - name: Language-Augmented Multimodal
    description: Language is integrated with multiple modalities in the world model.
  - name: Inverse Rendering
    description: Relighting explicitly recovers geometry, material or illumination factors.
  - name: Reflectance-Aware Representation
    description: A scene-specific representation explicitly models reflectance for relighting.
  - name: Image-to-Image Relighting
    description: Relighting is learned as a direct image transformation without explicit factors.
  - name: Generative-Prior Relighting
    description: A pretrained generative prior is central to producing the relit result.
  - name: Direct Regression
    description: Depth is predicted directly by a discriminative regression model.
  - name: Geometric Matching
    description: Correspondence, cost volumes or triangulation are central to depth estimation.
  - name: Generative Prior
    description: A diffusion or other generative prior is central to depth inference.
  - name: Optimization/Rendering-Based
    description: Depth is recovered through explicit optimization or rendering consistency.
  condition:
  - name: Text Conditioning
    description: Natural-language prompts are the primary image condition.
  - name: Reference Conditioning
    description: One or more reference images provide appearance, identity or content control.
  - name: Structural Conditioning
    description: Pose, edge, depth, segmentation or layout provides structural control.
  - name: Multi-Condition Control
    description: Multiple distinct control signals are jointly supported.
  - name: Text Conditioned
    description: Text is the primary condition for video generation or editing.
  - name: Image Conditioned
    description: A still image is the primary condition for video synthesis.
  - name: Video Conditioned
    description: An input video is transformed, continued or otherwise conditioned upon.
  - name: Audio/Multimodal Conditioned
    description: Audio or multiple modalities directly condition video synthesis.
  - name: Text-to-3D
    description: Text is the primary input for producing a 3D result.
  - name: Single-Image-to-3D
    description: A single image is the primary observation for producing a 3D result.
  - name: Multi-View-to-3D
    description: Multiple views or video observations are used to produce a 3D result.
  - name: Unconditional Sampling
    description: New 3D content is sampled without an instance-specific input condition.
  representation:
  - name: Pixel Space
    description: Images or videos are generated or modeled directly in observation space.
  - name: Discrete Tokens
    description: A discrete visual tokenizer or codebook representation is central.
  - name: Continuous Latents
    description: A continuous learned latent representation is central.
  - name: NeRF
    description: A neural radiance field represents 3D geometry and appearance.
  - name: Gaussian Splatting
    description: Explicit Gaussian primitives represent a 3D or 4D scene.
  - name: Mesh
    description: Triangle, polygon or CAD surfaces form the primary 3D representation.
  - name: Point Cloud
    description: Explicit point sets form the primary 3D representation.
  - name: Implicit Field
    description: Occupancy, signed-distance or another continuous field represents geometry.
  - name: Voxel/Grid
    description: Voxels, feature grids or triplanes form the primary 3D representation.
  - name: Relightable 3D Scene
    description: A multi-view or 3D scene representation explicitly supports novel illumination.
  - name: Pixel/Observation Space
    description: A world model predicts raw observations such as images or video frames.
  - name: Joint Embedding
    description: A world model predicts target representations in an embedding space.
  - name: Object-Centric
    description: Entities, slots or compositional objects structure the world state.
  - name: 3D/Occupancy
    description: Geometry, BEV, occupancy or another explicit spatial state represents the world.
  temporal:
  - name: Joint Spatiotemporal
    description: Space and time are modeled jointly with 3D or unified spatiotemporal operations.
  - name: Factorized Spatial-Temporal
    description: Spatial and temporal modeling are explicitly separated or factorized.
  - name: Latent Dynamics
    description: Temporal evolution is predicted in a learned latent state.
  - name: Long-Horizon Generation
    description: The method explicitly targets long-duration generation or drift control.
  pipeline:
  - name: Feed-Forward
    description: A trained network produces the 3D result in one or a few direct passes.
  - name: Optimization-Based
    description: Per-instance optimization directly constructs the 3D result.
  - name: Generative-Prior Optimization
    description: A pretrained image or video generator guides 3D optimization.
  - name: Procedural
    description: Rules, programs or procedural structure are central to 3D generation.
  reasoning:
  - name: Imagination-Based Planning
    description: The model rolls out imagined futures to select or improve actions.
  - name: World-Model Policy Learning
    description: Policies or value functions are learned using predicted world trajectories.
  - name: Counterfactual Reasoning
    description: The model evaluates interventions or alternative possible futures.
  - name: Planning Under Uncertainty
    description: Planning explicitly represents uncertainty over states, dynamics or outcomes.
  control:
  - name: Parametric Lighting
    description: Explicit light direction, position, color or intensity controls the result.
  - name: Environment Map
    description: An HDR or LDR environment map specifies or represents illumination.
  - name: Reference-Guided
    description: A guide image supplies the target illumination appearance.
  - name: Text-Guided
    description: Natural language specifies the target lighting change.
  - name: Spatially-Varying Lighting
    description: Illumination varies spatially across the scene or target.
  setup:
  - name: Monocular
    description: Depth is estimated from one RGB image.
  - name: Stereo
    description: A calibrated or uncalibrated stereo pair provides depth evidence.
  - name: Multi-View
    description: More than two views provide geometric depth evidence.
  - name: Video
    description: Temporal image sequences provide depth evidence or consistency.
  - name: Depth Completion
    description: Sparse or partial depth is completed into a dense estimate.
  output:
  - name: Metric Depth
    description: Predictions target depth in an absolute physical scale.
  - name: Relative Depth
    description: Predictions preserve ordinal or scale-and-shift-invariant depth relations.
  - name: Disparity
    description: The primary prediction is inverse depth or stereo disparity.
  learning:
  - name: Supervised
    description: Ground-truth depth directly supervises training.
  - name: Self-Supervised
    description: Geometry, reconstruction or temporal consistency supplies supervision.
  - name: Weak/Semi-Supervised
    description: Training combines limited labels with weak, pseudo or unlabeled supervision.
  - name: Zero-Shot/Foundation Model
    description: Large-scale pretraining targets cross-domain zero-shot depth generalization.
  legacy:
  - name: Masked Modeling
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: VAE
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: Consistency Model
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: Score Distillation
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: Differentiable Rendering
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: Joint Embedding Prediction
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: Relighting
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: Neural Rendering
    description: Legacy tag retained only so existing public annotations remain readable.
  - name: Depth Estimation
    description: The core task is estimating or completing monocular, stereo, multi-view, metric or relative depth.
      Search subtopic under 3D, also applicable to surveys.
