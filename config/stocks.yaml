schema_version: 1
timezone: Asia/Shanghai
event_timezone: America/New_York
update:
  weekday: sunday
  hour: 8
indicators:
  cpi:
    label: CPI
    group: inflation
    official_domains: [bls.gov]
    sources:
      - {title: BLS CPI release calendar, url: 'https://www.bls.gov/schedule/news_release/cpi.htm'}
  core_cpi:
    label: Core CPI
    group: inflation
    official_domains: [bls.gov]
    sources:
      - {title: BLS Consumer Price Index, url: 'https://www.bls.gov/cpi/'}
  pce:
    label: PCE
    group: inflation
    official_domains: [bea.gov]
    sources:
      - {title: BEA release schedule, url: 'https://www.bea.gov/news/schedule'}
  core_pce:
    label: Core PCE
    group: inflation
    official_domains: [bea.gov]
    sources:
      - {title: BEA Personal Consumption Expenditures Price Index, url: 'https://www.bea.gov/data/personal-consumption-expenditures-price-index'}
  nonfarm:
    label: 非农就业
    group: employment
    official_domains: [bls.gov]
    sources:
      - {title: BLS Employment Situation calendar, url: 'https://www.bls.gov/schedule/news_release/empsit.htm'}
  unemployment:
    label: 失业率
    group: employment
    official_domains: [bls.gov]
    sources:
      - {title: BLS Employment Situation, url: 'https://www.bls.gov/news.release/empsit.toc.htm'}
  hourly_earnings:
    label: 平均时薪
    group: employment
    official_domains: [bls.gov]
    sources:
      - {title: BLS Employment Situation, url: 'https://www.bls.gov/news.release/empsit.toc.htm'}
  fomc:
    label: FOMC
    group: policy
    official_domains: [federalreserve.gov]
    sources:
      - {title: Federal Reserve FOMC calendars, url: 'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm'}
  treasury_2y:
    label: 2Y 美债收益率
    group: yields
    official_domains: [treasury.gov, federalreserve.gov]
    sources:
      - {title: Treasury interest rate statistics, url: 'https://home.treasury.gov/resource-center-data-chart-center/interest-rates'}
      - {title: Federal Reserve H.15 Selected Interest Rates, url: 'https://www.federalreserve.gov/releases/h15/'}
  treasury_10y:
    label: 10Y 美债收益率
    group: yields
    official_domains: [treasury.gov, federalreserve.gov]
    sources:
      - {title: Treasury interest rate statistics, url: 'https://home.treasury.gov/resource-center-data-chart-center/interest-rates'}
      - {title: Federal Reserve H.15 Selected Interest Rates, url: 'https://www.federalreserve.gov/releases/h15/'}
