        title: Automatic Sampling for Discontinuities in Differentiable Shaders
        award_url: https://asia.siggraph.org/2025/program/award-winners/
        paper_url: https://doi.org/10.1145/3763291
        reading: 将分段连续的着色器转换成分段常数代理，在随机线段上搜索不连续边界并比较两侧值，估计边界导数；证据来自逆图形及着色器实例，不代表任意神经图像模型都可直接套用。
      - name: Technical Papers Best Paper Award
        title: 'BSP-OT: Sparse transport plans between discrete measures in loglinear time'
