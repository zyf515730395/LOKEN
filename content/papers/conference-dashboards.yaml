    awards:
      - name: Technical Papers Best Paper Award
        title: 'Fovea Stacking: Imaging with Dynamic Localized Aberration Correction'
        award_url: https://asia.siggraph.org/2025/program/award-winners/
        paper_url: https://doi.org/10.1145/3763278
        reading: 用可变形相位板在采集端动态纠正局部像差，再合成多次拍摄中的清晰区域；全画幅合成依赖专门光学器件和多帧，不是任意单图的后处理超分。
      - name: Technical Papers Best Paper Award
        title: Automatic Sampling for Discontinuities in Differentiable Shaders
        award_url: https://asia.siggraph.org/2025/program/award-winners/
        paper_url: https://doi.org/10.1145/3763291
        reading: 将分段连续的着色器转换成分段常数代理，在随机线段上搜索不连续边界并比较两侧值，估计边界导数；证据来自逆图形及着色器实例，不代表任意神经图像模型都可直接套用。
      - name: Technical Papers Best Paper Award
        title: 'BSP-OT: Sparse transport plans between discrete measures in loglinear time'
        award_url: https://asia.siggraph.org/2025/program/award-winners/
        paper_url: https://doi.org/10.1145/3763281
        reading: 用匹配的二元空间分割树生成多个稀疏耦合，再合并以降低传输代价。论文的低误差证据来自特定三维点集实验，方法给出近似传输，不承诺一般情形的精确最优。
    themes:
      - kind: 新模型范式
        title: 在采集时主动获得局部高频
        analysis: Fovea Stacking 用可控光学器件把清晰区域移到所需位置，并利用多帧得到全画面清晰图。与软件超分的区别是它实际采集到新的高频；做对照时应把额外硬件和采集帧数计入预算。
        references:
          - title: Fovea Stacking
            url: https://doi.org/10.1145/3763278
      - kind: 新概念
        title: 显式采样不连续边界的梯度
        analysis: 逆渲染遇到遮挡或硬边时，平滑区域的梯度不能替代跳变贡献。该论文以线段采样估计着色器跳变边界；若用于研究清晰轮廓，可将边界误差与平滑区域误差分别测量。
        references:
          - title: Automatic Sampling for Discontinuities in Differentiable Shaders
            url: https://doi.org/10.1145/3763291
      - kind: 技术趋势
        title: 把灯光舞台测到的人脸反射迁移到单张肖像
        analysis: 3DPR 利用 139 位受试者的多视图逐灯点亮影像学习人脸反射，再将普通肖像映射到预训练头部模型的潜空间，合成不同光源下的响应。这里单张图是使用阶段的输入，反射先验来自训练阶段的受控多视图采集。
        references:
          - title: 3DPR（作者机构论文库）
            url: https://research-explorer.ista.ac.at/record/21474
  CVPR 2024:
    statistics:
