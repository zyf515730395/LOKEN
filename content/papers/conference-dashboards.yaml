        value: 27%
        scope: 官方事实表公布的整数百分比。
        source_url: https://media.icml.cc/Conferences/ICML2025/ICML2025_Fact_Sheet.pdf
    awards:
      - name: Outstanding Paper
        title: 'Train for the Worst, Plan for the Best: Understanding Token Ordering in Masked Diffusions'
        award_url: https://icml.cc/virtual/2025/awards_detail
        paper_url: https://proceedings.mlr.press/v267/kim25ah.html
        reading: 掩码扩散训练要学习许多不同的填空次序，推理时则可以选择先填哪一格。在论文测试的数独题上，自适应解码将预训练模型的解题准确率从不足 7% 提升到约 90%。
      - name: Outstanding Paper
        title: 'Roll the dice & look before you leap: Going beyond the creative limits of next-token prediction'
        award_url: https://icml.cc/virtual/2025/awards_detail
        paper_url: https://proceedings.mlr.press/v267/nagarajan25a.html
        reading: 用可验证的图连接与模式构造任务研究序列生成；在这些任务上，多 token 训练提高输出的多样性与新颖性，输入端注入随机性也可维持连贯性。
      - name: Outstanding Paper
        title: 'CollabLLM: From Passive Responders to Active Collaborators'
        award_url: https://icml.cc/virtual/2025/awards_detail
        paper_url: https://proceedings.mlr.press/v267/wu25i.html
        reading: 模拟一条回复之后可能发生的对话，以后续任务结果奖励当前回复。作者用多轮任务和 201 名评审者的用户研究检验这种训练能否更早澄清意图。
    themes:
      - kind: 新概念
        title: 把先生成哪个位置当成推理决策
        analysis: 掩码扩散可先填较易确定的位置，再用新信息约束余下位置。另一项工作用图连接和模式构造检验提前规划的作用。数独解题率与开放任务中新样本的多样性回答不同问题，两组结果应分别解读。
        references:
          - title: Train for the Worst, Plan for the Best
            url: https://proceedings.mlr.press/v267/kim25ah.html
          - title: Roll the dice & look before you leap
            url: https://proceedings.mlr.press/v267/nagarajan25a.html
      - kind: 新模型范式
        title: 用后续对话判断此刻是否值得追问
        analysis: CollabLLM 在模拟对话中评估不同回复对最终任务的影响。读实验时可以把任务完成质量、用户花费的时间和对话轮数分开看，判断一次追问究竟节省了返工，还是增加了负担。
        references:
          - title: CollabLLM
            url: https://proceedings.mlr.press/v267/wu25i.html
      - kind: 技术趋势
        title: 自回归图像生成开始直接处理连续特征
        analysis: Orthus 在图文交错序列中用分类头产生文字，用扩散头产生连续图像特征。Continuous VAR 则用能量评分训练连续视觉预测。两者都避免把所有视觉内容硬量化成词表索引，却采用不同的训练目标。
        references:
          - title: Orthus
            url: https://proceedings.mlr.press/v267/kou25a.html
          - title: Continuous Visual Autoregressive Generation via Score Maximization
            url: https://proceedings.mlr.press/v267/shao25b.html
