    awards:
      - name: Outstanding Paper Award
        title: "ReconVLA: Reconstructive Vision-Language-Action Model as Effective Robot Perceiver"
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-conference-paper-awards-and-recognition/
        paper_url: https://ojs.aaai.org/index.php/AAAI/article/view/38921
        reading: 训练时用扩散 Transformer 重建当前观测中与操作目标对应的区域，作为动作学习之外的视觉监督，引导 VLA 减少对无关干扰物的关注。论文在仿真和所选实体任务上验证了效果，不能替代跨机器人或开放场景的系统评估。
      - name: Outstanding Paper Award
        title: Causal Structure Learning for Dynamical Systems with Theoretical Score Analysis
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-conference-paper-awards-and-recognition/
        paper_url: https://ojs.aaai.org/index.php/AAAI/article/view/40999
        reading: 用基于差分的因果模型描述连续动态系统，再通过评分分析学习变量之间的因果结构。有别于直接套用离散时间动态贝叶斯网络，它把连续变化的建模假设显式写进发现过程。
    themes:
      - kind: 新模型范式
        title: 用局部重建教机器人看对地方
        analysis: ReconVLA 将当前图像的目标区域重建作为辅助任务，重点是精确感知而非预测下一帧。可把它看成一条可检验的 VLA 设计路线：在动作监督外增加对任务相关视觉表征的约束。这只概括该获奖案例，不代表 AAAI 全会的技术分布。
        references:
          - title: ReconVLA（AAAI 正式论文）
            url: https://ojs.aaai.org/index.php/AAAI/article/view/38921
      - kind: 技术趋势
        title: 文本改图怎样保住原图细节
        analysis: FIA-Edit 在源图与目标图的注意力特征之间交换频率成分。TweezeEdit 则约束整条去噪路径，使编辑沿途保留原图语义。比较两条路线时，可分别观察提示词要求的变化和背景中本应保留的细节。
        references:
          - title: FIA-Edit
            url: https://ojs.aaai.org/index.php/AAAI/article/view/38145
          - title: TweezeEdit
            url: https://ojs.aaai.org/index.php/AAAI/article/view/37738
      - kind: 新概念
        title: 镜头转回原处时，场景还一致吗
        analysis: 360Explorer 用全景视图检查镜头原地转动后，再次看到的区域能否与先前画面对应。动态点云同时表示相机运动和物体运动，让同一视角下合理的物体位移也能纳入比较。
        references:
          - title: 360Explorer
            url: https://ojs.aaai.org/index.php/AAAI/article/download/37325/41287
