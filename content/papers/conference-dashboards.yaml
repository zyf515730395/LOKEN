    awards:
      - name: Best Paper（主赛道）
        title: 'Visual Autoregressive Modeling: Scalable Image Generation via Next-Scale Prediction'
        award_url: https://media.neurips.cc/Conferences/NeurIPS2024/NeurIPS2024_Best_Paper_Awards.pdf
        paper_url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/9a24e284b187f662681440ba15c416fb-Abstract.html
        reading: VAR 先生成粗尺度图像表示，再逐级预测更细的整张特征图。论文在 ImageNet 256×256 上比较了生成质量、推理速度和模型规模。
      - name: Runner-Up（主赛道）
        title: Guiding a Diffusion Model with a Bad Version of Itself
        award_url: https://media.neurips.cc/Conferences/NeurIPS2024/NeurIPS2024_Best_Paper_Awards.pdf
        paper_url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/5ee7ed60a7e8169012224dec5fe0d27f-Abstract-Conference.html
        reading: 用更小、训练较少的同类模型提供引导信号，在 ImageNet 类别条件和无条件生成中检验图像质量与多样性的变化。
      - name: Best Paper（数据集及基准赛道）
        title: 'The PRISM Alignment Dataset: What Participatory, Representative and Individualised Human Feedback Reveals About the Subjective and Multicultural Alignment of Large Language Models'
        award_url: https://media.neurips.cc/Conferences/NeurIPS2024/NeurIPS2024_Best_Paper_Awards.pdf
        paper_url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/be2e1b68b44f2419e19f6c35a1b8cf35-Abstract.html
        reading: 将 75 个国家 1,500 名参与者的背景和偏好关联到他们与 21 个语言模型进行的 8,011 段实时对话。按人口普查构建的代表性样本限于英国和美国。
    themes:
      - kind: 新模型范式
        title: 把下一步预测从单个 token 改为下一层分辨率
        analysis: VAR 用低分辨率层决定大体布局，再预测更高分辨率层的细节。在同一层中可并行生成多个位置。论文给出了 ImageNet 类别条件生成结果，也分别检验了补图、扩图和编辑。
        references:
          - title: Visual Autoregressive Modeling
            url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/9a24e284b187f662681440ba15c416fb-Abstract.html
      - kind: 新概念
        title: 用弱模型判断扩散采样该往哪里调整
        analysis: Autoguidance 比较同一家族强弱模型给出的去噪方向，利用两者之差引导采样。和无分类器引导对照时，关键实验是固定条件，观察提升清晰度时保留了多少样本变化。
        references:
          - title: Guiding a Diffusion Model with a Bad Version of Itself
            url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/5ee7ed60a7e8169012224dec5fe0d27f-Abstract-Conference.html
      - kind: 技术趋势
        title: 重新选择图像自回归预测的单位
        analysis: VAR 按分辨率整层生成离散图像表示，MAR 则用扩散损失来描述连续视觉 token 的条件分布。两篇工作分别改变了预测顺序与输出分布，说明选择自回归框架之后，仍可独立设计视觉表示。
        references:
          - title: Visual Autoregressive Modeling
            url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/9a24e284b187f662681440ba15c416fb-Abstract.html
          - title: Autoregressive Image Generation without Vector Quantization
            url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/66e226469f20625aaebddbe47f0ca997-Abstract-Conference.html
