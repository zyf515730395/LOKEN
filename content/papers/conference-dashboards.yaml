        analysis: 如果模型把缺少视觉信息的背景块用来保存全局计算结果，这些位置可能在特征图中异常突出。论文用额外 token 承担这部分计算，并在目标发现与稠密预测中检验变化。
        references:
          - title: Vision Transformers Need Registers
            url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/0b408293619f725fd30162af057e531a-Abstract-Conference.html
      - kind: 技术趋势
        title: 少步扩散同时探索直接训练与跨步跳转
        analysis: 改进的一致性训练直接从数据学习一步生成，通过改变教师更新、损失和噪声日程改善样本质量。CTM 则学习在概率流轨迹的任意两个时刻之间跳转，使同一模型能用不同步数生成。
        references:
          - title: Improved Techniques for Training Consistency Models
            url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/41bd71e7bf7f9fe68f1c936940fd06bd-Abstract-Conference.html
          - title: Consistency Trajectory Models
            url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/c204d12afa0175285e5aac65188808b4-Abstract-Conference.html
      - kind: 新模型范式
        title: 将视频拆成共享内容帧和运动表示
        analysis: CMD 将多帧视频编码为一张承载共同外观的内容帧及低维运动表示。前者复用预训练图像扩散模型，后者交给轻量扩散模型生成，作者据此检验减少视频训练开销后能否维持生成质量。
        references:
          - title: Efficient Video Diffusion Models via Content-Frame Motion-Latent Decomposition
            url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/28b5dfc51e5ae12d84fb7c6172a00df4-Abstract-Conference.html
