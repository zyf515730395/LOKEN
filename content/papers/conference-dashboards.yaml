        source_url: https://www.jliip.org/nd.jsp?id=54
    awards:
      - name: Outstanding Paper Award
        title: Reliable Conflictive Multi-View Learning
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-24-paper-awards/
        paper_url: https://ojs.aaai.org/index.php/AAAI/article/download/29546/30911
        reading: 当图像与其他视图给出矛盾线索时，模型分别估计各视图对类别的支持，再合并意见，同时给出预测及其可靠程度。
      - name: Outstanding Paper Award
        title: Proportional Aggregation of Preferences for Sequential Decision Making
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-24-paper-awards/
        paper_url: https://ojs.aaai.org/index.php/AAAI/article/download/28813/29553
        reading: 研究群体连续面对多次选择时，怎样让少数群体的偏好也在一系列决策中获得相称代表。论文把多席位投票的比例代表公理推广到逐轮决策。
      - name: Outstanding Paper Award
        title: 'GxVAEs: Two Joint VAEs Generate Hit Molecules from Gene Expression Profiles'
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-24-paper-awards/
        paper_url: https://ojs.aaai.org/index.php/AAAI/article/download/29248/30357
        reading: 作者把基因表达谱和化合物映射到可关联的潜在表示，用已有实验记录评估模型给出的候选。论文提供了计算验证，候选的实际效果仍需实验检验。
    themes:
      - kind: 技术趋势
        title: 将图像风格分解到不同频段
        analysis: AesFA 按频率分解参考图像的风格特征，用端到端训练的轻量网络做任意风格迁移。评估这类方法时，纹理和色调的迁移质量与推理开销都值得单独比较。
        references:
          - title: 'AesFA: An Aesthetic Feature-Aware Arbitrary Neural Style Transfer'
            url: https://ojs.aaai.org/index.php/AAAI/article/download/29232/30325
      - kind: 新概念
        title: 让多视图预测报告输入间的冲突
        analysis: RCML 将相互矛盾的视图也纳入预测任务。作者的 ECML 方法分别估计各视图的证据，融合时保留分歧对可靠性的影响。
        references:
          - title: Reliable Conflictive Multi-View Learning
            url: https://ojs.aaai.org/index.php/AAAI/article/download/29546/30911
      - kind: 新模型范式
        title: 从单张图像和残缺点云补出完整形状
        analysis: CDPNet 从单张图像提取物体的整体形状，再用残缺点云中可见的局部几何细化点块。对于同一处缺口，可以分别考察图像提供的轮廓线索和点云保留下来的表面细节。
        references:
          - title: CDPNet
            url: https://ojs.aaai.org/index.php/AAAI/article/download/27930/27881
