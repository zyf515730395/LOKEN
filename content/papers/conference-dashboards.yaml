        source_url: https://media.eventhosts.cc/Conferences/CVPR2024/CVPR_main_conf_2024.pdf#page=3
    awards:
      - name: Best Paper
        title: Generative Image Dynamics
        award_url: https://cvpr.thecvf.com/Conferences/2024/News/Wrap_Release
        paper_url: https://openaccess.thecvf.com/content/CVPR2024/html/Li_Generative_Image_Dynamics_CVPR_2024_paper.html
        reading: 从自然视频学习图像平面内运动的频谱表示，给一张照片就能合成植物摇曳等循环运动，也能响应用户施加的局部扰动。
      - name: Best Paper
        title: Rich Human Feedback for Text-to-Image Generation
        award_url: https://cvpr.thecvf.com/Conferences/2024/News/Wrap_Release
        paper_url: https://openaccess.thecvf.com/content/CVPR2024/html/Liang_Rich_Human_Feedback_for_Text-to-Image_Generation_CVPR_2024_paper.html
        reading: 请标注者指出生成图像的瑕疵位置和提示词不匹配之处，再训练反馈预测器。预测结果既可用于筛选微调样本，也可生成局部重绘的掩码。
      - name: Best Student Paper
        title: 'Mip-Splatting: Alias-free 3D Gaussian Splatting'
        award_url: https://cvpr.thecvf.com/Conferences/2024/News/Wrap_Release
        paper_url: https://openaccess.thecvf.com/content/CVPR2024/html/Yu_Mip-Splatting_Alias-free_3D_Gaussian_Splatting_CVPR_2024_paper.html
        reading: 在三维空间按训练视图的采样频率约束高斯尺度，再在投影时使用二维 Mip 滤波，减轻改变焦距或相机距离时出现的混叠。
    themes:
      - kind: 新模型范式
        title: 先预测运动频谱，再让照片动起来
        analysis: 摆动的树枝会反复经过相似的位置。Generative Image Dynamics 用从真实视频学到的运动频谱表示这种周期性，同一张照片既能生成循环动画，也能在交互时对一次推拉给出连贯响应。
        references:
          - title: Generative Image Dynamics
            url: https://openaccess.thecvf.com/content/CVPR2024/html/Li_Generative_Image_Dynamics_CVPR_2024_paper.html
      - kind: 新概念
        title: 让图像评价指出哪里需要重绘
        analysis: 一张生成图即使整体符合提示，也可能有局部结构错误。Rich Human Feedback 把瑕疵定位和文本对齐分别标注，因此预测结果能指向具体需要重绘的区域，并可用来筛选下一轮训练数据。
        references:
          - title: Rich Human Feedback for Text-to-Image Generation
            url: https://openaccess.thecvf.com/content/CVPR2024/html/Liang_Rich_Human_Feedback_for_Text-to-Image_Generation_CVPR_2024_paper.html
      - kind: 技术趋势
        title: 用图像语义约束超分辨率纹理
        analysis: 细小纹理被模糊后，多种高分辨率结果都可能与输入相容。SeeSR 从退化图像提取标签和连续特征，为扩散生成提供语义条件；SeD 则在训练时把语义特征交给判别器，让同一块纹理是否可信取决于它属于哪类物体。
        references:
          - title: SeeSR
            url: https://openaccess.thecvf.com/content/CVPR2024/html/Wu_SeeSR_Towards_Semantics-Aware_Real-World_Image_Super-Resolution_CVPR_2024_paper.html
          - title: SeD
            url: https://openaccess.thecvf.com/content/CVPR2024/html/Li_SeD_Semantic-Aware_Discriminator_for_Image_Super-Resolution_CVPR_2024_paper.html
