      - kind: 新概念
        title: 先补全场景物体，再约束相对布局
        analysis: CAST 把单图三维生成拆成物体几何和场景布局两步。评价也可分两层：局部检查看不见的一面是否合理，整体检查各物体与原图投影和支撑关系是否一致。
