        reading: 一次前向计算从一张或多张图像推断相机参数、三维点图与点轨迹，可直接得到多视图重建的初值。
      - name: Best Student Paper
        title: Neural Inverse Rendering from Propagating Light
        award_url: https://cvpr.thecvf.com/Conferences/2025/BestPapersDemos
        paper_url: https://openaccess.thecvf.com/content/CVPR2025/html/Malik_Neural_Inverse_Rendering_from_Propagating_Light_CVPR_2025_paper.html
        reading: 用时间分辨激光雷达从多个视角记录光脉冲传播，反演几何并分解直接与间接光照。输入需包含普通 RGB 照片没有的光子到达时间。
      - name: Best Paper Honorable Mention
