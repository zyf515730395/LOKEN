        source_url: https://eccv.ecva.net/media/eccv-2024/Slides/2822.pdf
    awards:
      - name: Best Paper
        title: Minimalist Vision with Freeform Pixels
        award_url: https://eccv.ecva.net/Conferences/2024/Awards
        paper_url: https://cave.cs.columbia.edu/Statics/publications/pdfs/Klotz_ECCV24.pdf
        reading: 将光学掩模与探测器对应到网络第一层，针对下游任务共同学习像素形状与解码器。作者分别用八个自由形状像素做室内监测、照明测量及交通流估计。
      - name: Best Paper Honorable Mention
        title: 'Rasterized Edge Gradients: Handling Discontinuities Differentially'
        award_url: https://eccv.ecva.net/Conferences/2024/Awards
        paper_url: https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/11059_ECCV_2024_paper.php
        reading: 用像素间的微小边界近似可见性突变，计算光栅化结果对几何变化的梯度，可处理轮廓、遮挡和几何相交。
      - name: Best Paper Honorable Mention
        title: Concept Arithmetics for Circumventing Concept Inhibition in Diffusion Models
        award_url: https://eccv.ecva.net/Conferences/2024/Awards
        paper_url: https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/12206_ECCV_2024_paper.php
        reading: 作者检查扩散模型抑制指定概念后，相关视觉概念的组合是否仍会生成该内容。实验揭示了仅凭目标词测试概念移除效果的局限。
    themes:
      - kind: 新概念
        title: 为任务设计像素的形状
        analysis: 检测房间照明只需要从光场提取少量信息。Minimalist Vision 把像素形状放进训练环路，随后用光学掩模实现学得的形状。八个测量值足以完成论文中的若干专用任务，代价是更换任务时需要重新设计采样方式。
        references:
          - title: Minimalist Vision with Freeform Pixels
            url: https://cave.cs.columbia.edu/Statics/publications/pdfs/Klotz_ECCV24.pdf
      - kind: 技术趋势
        title: 让遮挡边缘也能传回几何梯度
        analysis: 反向优化三维几何时，移动轮廓可能让一个像素的可见表面突然切换。Rasterized Edge Gradients 通过微边界表示处理这种跳变，使轮廓和相交区域的像素误差也能用于更新几何。
        references:
          - title: 'Rasterized Edge Gradients: Handling Discontinuities Differentially'
            url: https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/11059_ECCV_2024_paper.php
      - kind: 新模型范式
        title: 先去除退化，再生成缺失细节
        analysis: DiffBIR 先用复原模块去除噪声等退化，得到结构较可靠的条件图，再用受条件控制的潜空间扩散模型补足细节。这样可以分别检查前段是否保住轮廓，以及后段新生成的纹理是否贴合输入。
        references:
          - title: DiffBIR（ECVA 论文集）
            url: https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/7690_ECCV_2024_paper.php
