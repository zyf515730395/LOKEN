        analysis: TSD-SR 用教师模型在生成结果和高清样本上的预测指导单步超分辨率模型，重点是纹理重建。OSDFace 同样缩短推理，却引入针对输入人脸的视觉表示，把身份一致性纳入评价。两篇给出了比较单步方案时需要同时衡量的速度、细节与保真代价。
