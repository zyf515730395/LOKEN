      - label: 开幕式公布录用
        value: 1,580
        scope: 同一投影片列出的录用论文，分母为现场公布的投稿量。
        source_url: https://ieeetv.ieee.org/channels/ras/welcome-ceremony-iros-2026
      - label: 开幕式公布录用率
        value: 40%
        scope: 大会投影片给出的取整值。入选团队此前公布了另一组录用通知阶段数据，投影片未解释两个阶段的差额。
        source_url: https://ieeetv.ieee.org/channels/ras/welcome-ceremony-iros-2026
      - label: 日程收录论文
        value: 超过 1,900
        scope: 大会发布日程指南时公布的规模，涵盖安排报告的论文。主会录用率采用上方开幕投影片所列的投稿和录用数。
        source_url: https://www.linkedin.com/posts/iros2026pittsburgh_iros-2026-program-schedules-activity-7499183379108589568-7fQT
    awards:
      - name: Best Paper Award
        title: 'LT-Mem: Volatility-Aware Spatio-Temporal Memory for Lifelong Scene Understanding'
        award_url: https://team-aprl.github.io/news.html
        paper_url: https://arxiv.org/abs/2608.19059
        reading: 跨多次到访对齐同一物体，根据过往状态变化更新记忆，在保留当前场景的同时回答物体何时移动等历史问题。
      - name: Best Student Paper Award
        title: Flatness-Preserving Residual Learning for Real-Time Tight Quadrotor Formation Flight
        award_url: https://pei06.github.io/Publications/
        paper_url: https://arxiv.org/abs/2607.12275
        reading: 两架四旋翼靠近时，上方旋翼的下洗气流会扰动下方飞行器。作者用实机实验检验了补偿这一效应后，两机能否更稳定地保持相对位置。
      - name: Best Mobile Manipulation Paper Award
        title: 'SteadyTray: Learning Object Balancing Tasks in Humanoid Tray Transport via Residual Reinforcement Learning'
        award_url: https://steadytray.github.io/
        paper_url: https://arxiv.org/abs/2603.10306
        reading: 把人形机器人的步态和托盘姿态补偿分开学习，在双足原型上检验行走时未固定物体的稳定性。
      - name: Best Entertainment and Amusement Paper Award
        title: Learning Athletic Humanoid Tennis Skills from Imperfect Human Motion Data
        award_url: https://hughw19.github.io/
        paper_url: https://arxiv.org/abs/2603.12686
        reading: 利用不完美的人类动作片段学习挥拍技能，用落点和真实人机多回合对打检验动作能否用于连续回球。
    themes:
      - kind: 新模型范式
        title: 把物体状态与机器人动作放入同一规划空间
        analysis: LAMP 面向拥挤空间里的多机器人协作搬运。它用学到的操作模型提出动作，再在机器人和物体的联合状态空间搜索。论文比较了完整搜索与延后评估的规划方式，说明何时可以减少重新规划的等待时间。
        references:
          - title: LAMP
            url: https://arxiv.org/abs/2606.29358
      - kind: 新概念
        title: 根据物体的变化频率决定如何记忆
        analysis: LT-Mem 将当前物体状态、变化事件和长期统计分别保存。反复到访同一房间时，临时遮挡和真正搬走需要不同的更新方式。论文用多次拍摄的实验室和停车场序列检验跨时段查询。
        references:
          - title: LT-Mem
            url: https://arxiv.org/abs/2608.19059
      - kind: 技术趋势
        title: 用具体任务检验人形机器人的全身协调
        analysis: SteadyTray 要机器人行走时保持托盘载物稳定，LATENT 要机器人根据来球连续回球。两篇都把全身动作放进持续交互中，用载物能否保持、来球能否回到目标等任务结果检验策略。
        references:
          - title: SteadyTray
            url: https://arxiv.org/abs/2603.10306
          - title: LATENT
            url: https://arxiv.org/abs/2603.12686
