version: 1
editions:
  CVPR 2026:
    statistics:
      - label: 有效投稿
        value: '16,092'
        scope: 主会，进入审稿流程的有效投稿；主会项目手册第 3 页。
        source_url: https://media.eventhosts.cc/Conferences/CVPR2026/CVPR_main_conf_2026_15.pdf#page=3
      - label: 录用决定
        value: '4,089'
        scope: 主会审稿结束时的录用决定；不是论文库实际抓取条数，也不是手册所列的海报邀请组。
        source_url: https://media.eventhosts.cc/Conferences/CVPR2026/CVPR_main_conf_2026_15.pdf#page=3
      - label: 录用率
        value: '25.4%'
        scope: 主会审稿决定口径：4,089 ÷ 16,092。
        source_url: https://media.eventhosts.cc/Conferences/CVPR2026/CVPR_main_conf_2026_15.pdf#page=3
      - label: 海报邀请组论文
        value: '4,072'
        scope: 同一手册另列的海报邀请组；手册未说明与录用决定数的差额原因。
        source_url: https://media.eventhosts.cc/Conferences/CVPR2026/CVPR_main_conf_2026_15.pdf#page=3
    awards:
      - name: Best Paper
        title: Efficiently Reconstructing Dynamic Scenes One D4RT at a Time
        award_url: https://cvpr.thecvf.com/Conferences/2026/News/Best_Papers
        paper_url: https://arxiv.org/abs/2512.08924
        reading: 视频编码后用按需查询的解码器预测不同时刻、不同相机坐标系中的点，统一深度、时空对应和相机参数；论文检验的是动态几何与运动重建，而非可交互场景生成。
      - name: Best Student Paper
        title: Native and Compact Structured Latents for 3D Generation
        award_url: https://cvpr.thecvf.com/Conferences/2026/News/Best_Papers
        paper_url: https://arxiv.org/abs/2512.14692
        reading: O-Voxel 直接在稀疏体素中编码形状和 PBR 外观，并用稀疏卷积 VAE 压缩；论文处理三维资产及材质，不等于从任意实拍人像分离光照和纹理。
      - name: Best Student Paper Honorable Mention
        title: 'ChordEdit: One-Step Low-Energy Transport for Image Editing'
        award_url: https://cvpr.thecvf.com/Conferences/2026/News/Best_Papers
        paper_url: https://arxiv.org/abs/2602.19083
        reading: 从动态最优传输出发，以局部时间平滑估计低能量编辑场，在一步生成模型上做免训练、免反演的编辑；适用边界应在作者实际测试过的模型及编辑任务上分别核验。
    themes:
      - kind: 新模型范式
        title: 把动态 4D 重建变成按需查询
        analysis: D4RT 不必预先输出每一帧的所有几何与运动结果，而是将视频编码与点级查询解码解耦。读这篇时可分别看遮挡区域追踪、相机估计与稠密重建，再判断哪一部分能复用于自己的视频管线。
        references:
          - title: D4RT
            url: https://arxiv.org/abs/2512.08924
      - kind: 技术趋势
        title: 流模型编辑从免反演走向一步
        analysis: ICCV 2025 的 FlowEdit 直接积分源到目标的传输 ODE；本届 ChordEdit 将目标推向一步近似。两篇是相关路线的例子，不代表整个会议的频数趋势。复现时应分别检查编辑耗时和无关区域的保真度，不能仅以单步推理判断编辑质量。
        references:
          - title: ChordEdit（CVPR 2026）
            url: https://arxiv.org/abs/2602.19083
          - title: FlowEdit（ICCV 2025，对照）
            url: https://arxiv.org/abs/2412.08629
      - kind: 新概念
        title: 把照片的照明拆成可独立调节的属性
        analysis: TokenLight 用不同的条件 token 表示光源的强度、颜色、柔和程度和三维位置，使用户可以固定其他条件，只改变其中一个参数。判断控制是否有效，可以跟踪阴影的位置和软硬是否随目标参数变化，同时检查主体外观是否保持。
        references:
          - title: TokenLight（CVF 论文集）
            url: https://openaccess.thecvf.com/content/CVPR2026/html/Chaturvedi_TokenLight_Precise_Lighting_Control_in_Images_using_Attribute_Tokens_CVPR_2026_paper.html
  ICCV 2025:
    statistics:
      - label: 有效投稿
        value: '11,239'
        scope: 主会有效投稿；主会项目手册第 3 页。
        source_url: https://media.eventhosts.cc/Conferences/ICCV2025/iccv25_main_program.pdf#page=3
      - label: 录用
        value: '2,701'
        scope: 主会项目手册；口头报告和亮点论文是录用论文中的展示类别，不另加。
        source_url: https://media.eventhosts.cc/Conferences/ICCV2025/iccv25_main_program.pdf#page=3
      - label: 录用率
        value: '24.0%'
        scope: 主会口径：2,701 ÷ 11,239，约 24.0%。
        source_url: https://media.eventhosts.cc/Conferences/ICCV2025/iccv25_main_program.pdf#page=3
    awards:
      - name: Best Paper（Marr Prize）
        title: Generating Physically Stable and Buildable Brick Structures from Text
        award_url: https://www.thecvf.com/?page_id=413
        paper_url: https://openaccess.thecvf.com/content/ICCV2025/html/Pun_Generating_Physically_Stable_and_Buildable_Brick_Structures_from_Text_ICCV_2025_paper.html
        reading: 推理时用物理稳定性和装配约束检查自回归砖块序列，必要时回滚；实验针对积木结构，不能外推成任意材料、连续拓扑的物理生成。
      - name: Best Student Paper
        title: 'FlowEdit: Inversion-Free Text-Based Editing Using Pre-Trained Flow Models'
        award_url: https://www.thecvf.com/?page_id=413
        paper_url: https://arxiv.org/abs/2412.08629
        reading: 构造从源提示分布直接到目标提示分布的 ODE，无需先反演到噪声；保真度优势来自论文所测的文本编辑设定，并非像素对齐或光照物理性的保证。
      - name: Best Paper Honorable Mention
        title: Spatially-Varying Autofocus
        award_url: https://www.thecvf.com/?page_id=413
        paper_url: https://openaccess.thecvf.com/content/ICCV2025/html/Qin_Spatially-Varying_Autofocus_ICCV_2025_paper.html
        reading: 相机让传感器的不同区域分别对焦，利用对比度和视差逐步调整焦面，使远近不同的物体能在同一张光学图像里同时清晰。
      - name: Best Paper Honorable Mention
        title: 'RayZer: A Self-supervised Large View Synthesis Model'
        award_url: https://www.thecvf.com/?page_id=413
        paper_url: https://openaccess.thecvf.com/content/ICCV2025/html/Jiang_RayZer_A_Self-supervised_Large_View_Synthesis_Model_ICCV_2025_paper.html
        reading: RayZer 从多张未标定照片估计相机参数并重建场景，再从预测的相机位置渲染留出的视图。渲染结果与实拍图像之间的差异提供训练信号，省去了人工相机位姿和三维几何标注。
    themes:
      - kind: 新模型范式
        title: 同一个 DiT 中联合处理参考图条件
        analysis: OminiControl 复用原模型的 VAE 和 Transformer，将图像条件与生成 token 放在同一序列，以动态位置编码区分对齐和不对齐条件。主要在空间控制和主体驱动生成中验证，并未覆盖一般参考图超分。
        references:
          - title: OminiControl（ICCV 2025 Highlight）
            url: https://openaccess.thecvf.com/content/ICCV2025/html/Tan_OminiControl_Minimal_and_Universal_Control_for_Diffusion_Transformer_ICCV_2025_paper.html
      - kind: 新概念
        title: 把可执行的物理检查放进生成循环
        analysis: BrickGPT 把候选生成与约束验证拆开：生成器提出砖块，规则拒绝不稳定或无法装配的动作。这是离散积木中的证据；对其他视觉任务，可借鉴先把可验证约束独立出来，而不是沿用积木求解器。
        references:
          - title: BrickGPT
            url: https://arxiv.org/abs/2505.05469
      - kind: 技术趋势
        title: 把退化判断和内容理解接入生成式超分
        analysis: PURE 让同一个多模态自回归模型先判断输入退化程度，再描述图像内容，最后生成高清图像 token。中间描述也给误差分析留下依据：若文字已误认物体，可继续核对这种误认是否表现为输出中的错误纹理。
        references:
          - title: Perceive, Understand and Restore（CVF 论文集）
            url: https://openaccess.thecvf.com/content/ICCV2025/html/Wei_Perceive_Understand_and_Restore_Real-World_Image_Super-Resolution_with_Autoregressive_Multimodal_ICCV_2025_paper.html
  ICLR 2026:
    statistics:
      - label: 有效投稿
        value: '19,525'
        scope: 项目主席所列格式合规、有效投稿；含后来撤稿或被桌拒的部分。
        source_url: https://blog.iclr.cc/2026/03/31/a-retrospective-on-the-iclr-2026-review-process/
      - label: 录用
        value: '5,355'
        scope: 项目主席审稿回顾中的录用决定；不以事后公开库快照替代。
        source_url: https://blog.iclr.cc/2026/03/31/a-retrospective-on-the-iclr-2026-review-process/
      - label: 官方录用率
        value: '27.4%'
        scope: 以有效投稿为分母，5,355 ÷ 19,525；与仅对作出录用或拒稿决定的稿件计算的比率不同。
        source_url: https://blog.iclr.cc/2026/03/31/a-retrospective-on-the-iclr-2026-review-process/
      - label: 收到录用或拒稿决定
        value: '13,763'
        scope: 项目主席记录的审稿决定集合；不是上述官方录用率的分母。
        source_url: https://blog.iclr.cc/2026/03/31/a-retrospective-on-the-iclr-2026-review-process/
    awards:
      - name: Outstanding Paper
        title: Transformers are Inherently Succinct
        award_url: https://blog.iclr.cc/2026/04/23/announcing-the-iclr-2026-outstanding-papers/
        paper_url: https://proceedings.iclr.cc/paper_files/paper/2026/hash/5f7804e8855efe5554025217abc49315-Abstract-Conference.html
        reading: 用形式语言表示的描述长度比较 Transformer、有限自动机和时序逻辑；这是指定数学模型的表达简洁性结果，不是现实模型训练规模或推理速度的排名。
      - name: Outstanding Paper
        title: LLMs Get Lost In Multi-Turn Conversation
        award_url: https://blog.iclr.cc/2026/04/23/announcing-the-iclr-2026-outstanding-papers/
        paper_url: https://arxiv.org/abs/2505.06120
        reading: 将同一任务的信息分段注入对话，对照一次性给全提示；所测六类生成任务平均下降 39%，主要表现为答复更不可靠。不是对所有真实对话的普遍估计。
      - name: Honorable Mention
        title: 'The Polar Express: Optimal Matrix Sign Methods and their Application to the Muon Algorithm'
        award_url: https://blog.iclr.cc/2026/04/23/announcing-the-iclr-2026-outstanding-papers/
        paper_url: https://proceedings.iclr.cc/paper_files/paper/2026/hash/df88b275bef31ac96c85f0c4013734fc-Abstract-Conference.html
        reading: 以极小极大多项式逼近矩阵符号函数，并代入 Muon 的极分解步骤；实证验证包含 GPT-2/FineWeb，不能直接外推到图像 LoRA 或更大的训练规模。
    themes:
      - kind: 技术趋势
        title: 评测从单轮任务扩展到逐轮澄清
        analysis: 保持任务和最终可用信息一致，只改变信息到达方式，以区分会做任务与能否在多轮修正早期假设。可以借鉴这种设计测试多轮图像编辑：先给目标风格，再追加保真约束，与一次给全条件比较。
        references:
          - title: LLMs Get Lost In Multi-Turn Conversation
            url: https://arxiv.org/abs/2505.06120
      - kind: 新概念
        title: 最坏误差约束下的矩阵迭代
        analysis: Polar Express 将 Muon 内部的矩阵逼近写成可检验的极小极大目标。读论文时把理论最坏误差和训练中验证损失的改善分开，后者仍需要在目标模型和硬件上实测。
        references:
          - title: The Polar Express
            url: https://arxiv.org/abs/2505.16932
      - kind: 新模型范式
        title: 让生成模型在预训练视觉编码器的特征中采样
        analysis: RAE 将 DINO、SigLIP 或 MAE 等表征编码器与可训练的图像解码器配对，再训练扩散 Transformer 生成高维视觉特征。实验分别检验重建质量与生成质量，并考察输出头如何适应更宽的特征空间。
        references:
          - title: Diffusion Transformers with Representation Autoencoders
            url: https://proceedings.iclr.cc/paper_files/paper/2026/hash/3c4141c12660ad3625eb4ae845e0a6f9-Abstract-Conference.html
  ECCV 2026:
    statistics:
      - label: 论文集统计投稿量
        value: '10,473'
        scope: Springer 多卷正式论文集公布的投稿总数；非主办方会前报道的约数。
        source_url: https://link.springer.com/book/10.1007/978-3-032-37383-0
      - label: 正式论文集选录论文
        value: '2,834'
        scope: Springer 正式论文集口径；不用于推断其他赛道。
        source_url: https://link.springer.com/book/10.1007/978-3-032-37383-0
      - label: 按论文集口径计算的选录比例
        value: '约 27.06%'
        scope: 2,834 ÷ 10,473，本站根据 Springer 公布的两项数值计算。
        source_url: https://link.springer.com/book/10.1007/978-3-032-37383-0
    awards:
      - name: Best Paper
        title: "Heat Kernel Textures: the Geodesic Gaussians That Do Not Splat"
        award_url: https://eccv.ecva.net/Conferences/2026/AcceptedPapers
        paper_url: https://arxiv.org/html/2609.07557v1
        reading: 用三角网格表面的各向异性热核表示纹理，在曲面上更新核位置并控制密度，渲染时在光线交点求值，不需要 UV 展开。论文实证集中于反照率，尚未验证粗糙度或镜面分量；核聚合和邻域查询带来额外开销。
    themes:
      - kind: 新概念
        title: 用曲面内禀热核表示纹理
        analysis: HKTex 与其让欧氏空间的高斯贴近网格，不如直接在表面上定义纹理基元。它适用于已有网格上的纹理拟合和多视图反照率反演，不等于从图像恢复未知几何，也不能据此认定渲染更快。
        references:
          - title: HKTex 论文与实验（表 2、结论）
            url: https://arxiv.org/html/2609.07557v1
          - title: 作者项目页
            url: https://circle-group.github.io/research/HeatKernelTextures/
      - kind: 技术趋势
        title: 把前一段的照明延续到长视频下一段
        analysis: 短片段独立换光时，即使每段内都稳定，拼接处仍可能突然变亮或变色。HorizonRelight 把已换光片段的潜变量传给下一段，并在训练时遮蔽部分上下文，让模型学会接续。可在片段接缝处单独检验亮度、阴影与色调变化。
        references:
          - title: HorizonRelight（作者项目页）
            url: https://research.nvidia.com/labs/sil/projects/horizonrelight/
      - kind: 新模型范式
        title: 用同步运动的视频对学习传播首帧编辑
        analysis: Sync-LoRA 用运动轨迹相同、外观不同的视频对训练低秩适配器。推理时，首帧提供编辑后的外观，源视频提供逐帧运动，使换装或外观修改能跟随原片中的嘴形、头部运动与表情。
        references:
          - title: In-Context Sync-LoRA for Portrait Video Editing（ECCV 论文）
            url: https://cris.tau.ac.il/en/publications/in-context-sync-lora-for-portrait-video-editing/
  ICRA 2026:
    statistics:
      - label: 征稿结束时投稿数
        value: "5,088"
        scope: ICRA 官网征稿关闭后公布的原始投稿数；不作为最终有效投稿数或录用率分母。
        source_url: https://2026.ieee-icra.org/contribute/call-for-icra-2026-papers-now-accepting-submissions/
      - label: 录用会议论文
        value: 约 1,800
        scope: 大会在录用通知后公布的约数。公告同时列出征稿时的投稿数，未给最终评审分母。
        source_url: https://www.linkedin.com/posts/ieee-icra_icra2026-ieee-ras-activity-7425260175734902784-Ho2H
    awards:
      - name: Best Conference Paper Award
        title: "OmniRetarget: Interaction-Preserving Data Generation for Humanoid Whole-Body Loco-Manipulation and Scene Interaction"
        award_url: https://www.ieee-ras.org/lujie-yang-on-teaching-humanoid-robots-by-preserving-interactions/
        paper_url: https://ieeexplore.ieee.org/abstract/document/11696487
        reading: 用交互网格编码身体、地形和物体的空间关系及接触，优化时尽量保留这些关系，同时满足机器人运动学约束。源演示的接触如果重建错了，方法无法自动识别并纠正。
      - name: Best Conference Paper Award
        title: "SymSkill: Symbol and Skill Co-Invention for Data-Efficient and Reactive Long-Horizon Manipulation"
        award_url: https://www.ieee-ras.org/yifei-simon-shao-on-symskill-and-long-horizon-robot-manipulation/
        paper_url: https://arxiv.org/abs/2510.01661
        reading: 从自由交互演示中联合学习可复用的操作技能和符号前提，用符号规划组合长任务。当前实验依赖可跟踪的刚体及其相对位姿，速度分段只是动作边界的代理。
    themes:
      - kind: 技术趋势
        title: 用显式交互约束提高机器人演示的复用性
        analysis: 两篇获奖论文分别处理不同层级的复用：OmniRetarget 保留身体与环境的接触，使同一人类动作能适配不同物体和地形；SymSkill 学习可执行技能和符号前提，让技能可重组为新任务。这是两项研究体现的共同方向，不代表全会论文分布。
        references:
          - title: OmniRetarget 作者项目页
            url: https://omniretarget.github.io/
          - title: SymSkill 作者项目页
            url: https://symskill.github.io/
      - kind: 新模型范式
        title: 语言规划与强化学习技能分担布线任务
        analysis: DLO Routing 让视觉语言模型把布线要求拆成步骤，再由强化学习得到的低层技能执行。线材在移动中会变形，系统通过观测变化调整后续步骤；证据来自作者测试的线材、导向件及语言指令。
        references:
          - title: DLO Routing 论文
            url: https://arxiv.org/abs/2510.19268
          - title: ICRA 2026 官方论文场次
            url: https://2026.ieee-icra.org/awards/
      - kind: 新概念
        title: 用局部形变传播近似触觉材料的响应
        analysis: ETac 从高保真的有限元仿真中学习接触形变如何在弹性体表面传播，以较低开销为大量训练步骤提供触觉反馈。作者分别验证了形变误差和仅靠触觉的抓取任务，两个指标回答的是不同问题。
        references:
          - title: ETac
            url: https://arxiv.org/abs/2604.20295
          - title: ETac 作者项目页
            url: https://lassford.github.io/ETac/
