      - kind: 新概念
        title: 用动作条件视频评估导航路线
        analysis: Navigation World Models 把候选动作序列转换为未来第一人称视图。比较不同轨迹会把相机带到哪里，给视频生成提供了可检验的用途，也要求模型对动作方向与位移作出正确响应。
