        paper_url: https://clementjambon.github.io/wods/
        reading: 把复杂域拆成可处理的子域，用蒙特卡洛估计局部求解算子，再以稀疏线性系统耦合子域边界。把随机采样留给易并行的局部步骤，把全局一致性交给确定性求解。
    themes:
      - kind: 新概念
        title: 反演时，关键是选对未知量与观测
        analysis: 两篇获奖工作是互补例子：GimmBO 的未知量是适配器融合系数，反馈是人的样张偏好；离散 CT 则从物理投影估计已知材质的体素分布。它们的求解器并不通用，但都说明先明确参数和反馈，比直接增加生成或采样预算更有针对性。此处为获奖案例对读，不是全会统计。
        references:
          - title: GimmBO 作者项目
            url: https://gimmbo-project.github.io/
          - title: 离散 CT 逆渲染作者论文
            url: https://rgl.epfl.ch/publications/Nuic2026DiscreteCT
      - kind: 技术趋势
        title: 用真实动态照明训练人像视频换光
        analysis: Pixel Cube 用高速采集系统重现照明变化，并将实拍与合成数据用于训练视频扩散模型。逐帧 HDR 环境图指定目标光照，人物运动时既可检验阴影和高光是否跟随光源，也可检查相邻帧的人脸细节是否稳定。
        references:
          - title: Pixel Cube（作者论文）
            url: https://ivlab.cs.gmu.edu/files/SIGGRAPH2026_PixelCube_hi.pdf
      - kind: 新模型范式
        title: 用三维框为二维图像编辑指定姿态
        analysis: BoxCtrl 把平移、旋转和缩放编码成彩色三维包围盒提示，将目标几何与物体原有外观分开表达。模型先接受监督微调，再以强化学习提高变换精度；可分别检查输出是否服从目标位置和旋转角度，以及物体是否仍保留原来的材质和结构。
        references:
          - title: BoxCtrl（SIGGRAPH 技术论文）
            url: https://s2026.conference-schedule.org/presentation/?id=papers_998&sess=sess148
