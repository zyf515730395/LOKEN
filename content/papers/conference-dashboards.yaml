    awards:
      - name: Outstanding Paper
        title: 'AlphaEdit: Null-Space Constrained Knowledge Editing for Language Models'
        award_url: https://media.iclr.cc/Conferences/ICLR2025/ICLR2025_Outstanding_Paper_Awards.pdf
        paper_url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/29c8c615b3187ee995029284702d3f43-Abstract-Conference.html
        reading: 将参数更新投影到待保留知识表征的零空间，减少连续修改事实时对既有知识的影响。此处采用论文集标题，授奖公告将 Knowledge Editing 写作 Model Editing。
      - name: Outstanding Paper
        title: Learning Dynamics of LLM Finetuning
        award_url: https://media.iclr.cc/Conferences/ICLR2025/ICLR2025_Outstanding_Paper_Awards.pdf
        paper_url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/afe1aa79e5eea7955f553c61a307273e-Abstract-Conference.html
        reading: 逐步分解微调一个样本如何改变模型对其他回答的预测，分析监督微调与偏好微调，并解释离线 DPO 中偏好回答自身的概率也可能下降的现象。
      - name: Honorable Mention
        title: 'SAM 2: Segment Anything in Images and Videos'
        award_url: https://media.iclr.cc/Conferences/ICLR2025/ICLR2025_Outstanding_Paper_Awards.pdf
        paper_url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/45c1f6a8cbf2da59ebf2c802b4f742cd-Abstract-Conference.html
        reading: 以流式记忆将图像上的提示分割延伸到视频。作者在视频分割实验中同时衡量掩码质量和所需人工交互。
    themes:
      - kind: 新模型范式
        title: 让分割提示跨视频帧持续有效
        analysis: SAM 2 将先前帧的目标信息保存在记忆中，用它来辅助当前帧输出掩码。评估交互式视频分割时，可以同时检查目标遮挡后能否重新定位，以及恢复分割需要几次额外提示。
        references:
          - title: SAM 2
            url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/45c1f6a8cbf2da59ebf2c802b4f742cd-Abstract-Conference.html
      - kind: 新概念
        title: 测量模型更新对其他回答的影响
        analysis: AlphaEdit 先定义要保留的表征，再限制知识编辑的更新方向。微调动力学论文则追踪训练样本对其他输出概率的影响。前者衡量连续编辑能否保存旧知识，后者解释微调过程中回答偏好为何变化。
        references:
          - title: AlphaEdit
            url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/29c8c615b3187ee995029284702d3f43-Abstract-Conference.html
          - title: Learning Dynamics of LLM Finetuning
            url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/afe1aa79e5eea7955f553c61a307273e-Abstract-Conference.html
      - kind: 技术趋势
        title: 分别减少扩散 Transformer 的训练与推理开销
        analysis: REPA 用预训练图像编码器的干净特征监督去噪网络的中间层，缩短训练。DyDiT 在生成阶段按时间步调整模型宽度，并按空间位置减少计算。前者比较达到同等质量所需的训练步数，后者比较单次生成的开销。
        references:
          - title: Representation Alignment for Generation
            url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/d9e42b4d7163931f3689d6d6fbaa11d0-Abstract-Conference.html
          - title: Dynamic Diffusion Transformer
            url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/a44a70acd5d0abc1a252ada9719dd06d-Abstract-Conference.html
