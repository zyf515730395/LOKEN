        scope: 2,834 ÷ 10,473，本站根据 Springer 公布的两项数值计算。
        source_url: https://link.springer.com/book/10.1007/978-3-032-37383-0
    awards:
      - name: Best Paper
        title: "Heat Kernel Textures: the Geodesic Gaussians That Do Not Splat"
        award_url: https://eccv.ecva.net/Conferences/2026/AcceptedPapers
        paper_url: https://arxiv.org/html/2609.07557v1
        reading: 用三角网格表面的各向异性热核表示纹理，在曲面上更新核位置并控制密度，渲染时在光线交点求值，不需要 UV 展开。论文实证集中于反照率，尚未验证粗糙度或镜面分量；核聚合和邻域查询带来额外开销。
    themes:
      - kind: 新概念
        title: 用曲面内禀热核表示纹理
        analysis: HKTex 与其让欧氏空间的高斯贴近网格，不如直接在表面上定义纹理基元。它适用于已有网格上的纹理拟合和多视图反照率反演，不等于从图像恢复未知几何，也不能据此认定渲染更快。
        references:
          - title: HKTex 论文与实验（表 2、结论）
            url: https://arxiv.org/html/2609.07557v1
          - title: 作者项目页
            url: https://circle-group.github.io/research/HeatKernelTextures/
  ICRA 2026:
    statistics:
      - label: 征稿结束时投稿数
        value: "5,088"
        scope: ICRA 官网征稿关闭后公布的原始投稿数；不作为最终有效投稿数或录用率分母。
        source_url: https://2026.ieee-icra.org/contribute/call-for-icra-2026-papers-now-accepting-submissions/
    awards:
      - name: Best Conference Paper Award
        title: "OmniRetarget: Interaction-Preserving Data Generation for Humanoid Whole-Body Loco-Manipulation and Scene Interaction"
        award_url: https://www.ieee-ras.org/lujie-yang-on-teaching-humanoid-robots-by-preserving-interactions/
        paper_url: https://ieeexplore.ieee.org/abstract/document/11696487
        reading: 用交互网格编码身体、地形和物体的空间关系及接触，优化时尽量保留这些关系，同时满足机器人运动学约束。源演示的接触如果重建错了，方法无法自动识别并纠正。
      - name: Best Conference Paper Award
        title: "SymSkill: Symbol and Skill Co-Invention for Data-Efficient and Reactive Long-Horizon Manipulation"
        award_url: https://www.ieee-ras.org/yifei-simon-shao-on-symskill-and-long-horizon-robot-manipulation/
        paper_url: https://arxiv.org/abs/2510.01661
        reading: 从自由交互演示中联合学习可复用的操作技能和符号前提，用符号规划组合长任务。当前实验依赖可跟踪的刚体及其相对位姿，速度分段只是动作边界的代理。
    themes:
      - kind: 技术趋势
        title: 用显式交互约束提高机器人演示的复用性
        analysis: 两篇获奖论文分别处理不同层级的复用：OmniRetarget 保留身体与环境的接触，使同一人类动作能适配不同物体和地形；SymSkill 学习可执行技能和符号前提，让技能可重组为新任务。这是两项研究体现的共同方向，不代表全会论文分布。
        references:
          - title: OmniRetarget 作者项目页
            url: https://omniretarget.github.io/
          - title: SymSkill 作者项目页
            url: https://symskill.github.io/

  ICML 2026:
    statistics:
      - label: 进入评审
        value: "23,918"
        scope: 官方发出决定通知时的进入评审论文口径，不是所有登记投稿。
        source_url: https://www.linkedin.com/posts/icmlconf_decision-notifications-are-being-released-activity-7455685189479055361-PXq3
      - label: 录用论文
        value: "6,352"
        scope: 官方决定通知口径；不与会期开幕回顾的不同统计口径混算。
        source_url: https://www.linkedin.com/posts/icmlconf_decision-notifications-are-being-released-activity-7455685189479055361-PXq3
      - label: 录用率
        value: "26.6%"
        scope: 官方决定通知，6,352 篇录用 / 23,918 篇进入评审。
        source_url: https://www.linkedin.com/posts/icmlconf_decision-notifications-are-being-released-activity-7455685189479055361-PXq3
    awards:
      - name: Outstanding Paper Award
        title: "The Flexibility Trap: Rethinking the Value of Arbitrary Order in Diffusion Language Models"
        award_url: https://blog.icml.cc/2026/07/05/announcing-the-icml-2026-awards/
        paper_url: https://proceedings.mlr.press/v306/ni26e.html
        reading: 作者在数学与代码推理中观察到，扩散语言模型可能利用任意解码顺序绕过用于探索的高不确定性 token，过早缩窄候选答案。JustGRPO 简化推理强化学习训练，同时保留并行解码能力；这不意味着所有任务都该取消任意顺序。
      - name: Outstanding Paper Award
        title: High-Accuracy Sampling for Diffusion Models and Log-Concave Distributions
        award_url: https://blog.icml.cc/2026/07/05/announcing-the-icml-2026-awards/
        paper_url: https://proceedings.mlr.press/v306/chen26p.html
        reading: 给定足够准确的 L² 分数函数估计，作者构造采样算法，使取得目标误差所需步数对误差倒数仅呈多对数增长。重点是有明确假设的采样复杂度，不是宣布实际图像模型都能用几步无损生成。
    themes:
      - kind: 技术趋势
        title: 扩散建模的两类瓶颈：推理轨迹与采样误差
        analysis: 两篇杰出论文把问题拆在不同层级：语言扩散的瓶颈可以是探索轨迹选得不好；连续扩散则要区分采样器的离散化误差和分数估计误差。这是对两篇获奖工作的归纳，不能外推为全部录用论文的趋势。
        references:
          - title: The Flexibility Trap（PMLR）
            url: https://proceedings.mlr.press/v306/ni26e.html
          - title: High-Accuracy Sampling（PMLR）
            url: https://proceedings.mlr.press/v306/chen26p.html
