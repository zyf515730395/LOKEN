    awards:
      - name: Best Paper Award（主轨）
        title: "Gated Attention for Large Language Models: Non-linearity, Sparsity, and Attention-Sink-Free"
        award_url: https://blog.neurips.cc/2025/11/26/announcing-the-neurips-2025-best-paper-awards/
        paper_url: https://proceedings.neurips.cc/paper_files/paper/2025/hash/904e89bb4e632e75fb47f093b620b257-Abstract-Conference.html
        reading: 在标准缩放点积注意力的输出端，为每个头加一个依赖当前 query 的 sigmoid 门。作者在 1.7B 稠密、15B MoE 等实验设置下观察到更稳定的训练、缓解 attention sink 并改善长上下文外推；门控的是输出，不是用稀疏注意力替换 SDPA。
      - name: Best Paper Award（主轨）
        title: "Why Diffusion Models Don’t Memorize: The Role of Implicit Dynamical Regularization in Training"
        award_url: https://blog.neurips.cc/2025/11/26/announcing-the-neurips-2025-best-paper-awards/
        paper_url: https://papers.nips.cc/paper_files/paper/2025/hash/ceb7f3cc876a6dcb15130a645b5a4507-Abstract-Conference.html
        reading: 实验和可解析随机特征模型显示两个时间尺度：生成质量可以在较早时改善，而可检测的样本记忆在更晚才出现。这为早停为何有效提供了机制解释，不等于扩散模型永远不复制训练样本。
      - name: Best Paper Award（Datasets & Benchmarks 专轨）
        title: "Artificial Hivemind: The Open-Ended Homogeneity of Language Models (and Beyond)"
        award_url: https://blog.neurips.cc/2025/11/26/announcing-the-neurips-2025-best-paper-awards/
        paper_url: https://proceedings.neurips.cc/paper_files/paper/2025/hash/754d5a526a5ee5a47220664a0eb92751-Abstract-Datasets_and_Benchmarks_Track.html
        reading: Infinity-Chat 用约 2.6 万条开放式提问研究生成多样性，区分同一模型反复给出类似答案与不同模型彼此趋同。论文也发现，评价者偏好分歧更大的答案更容易导致模型评审与人类判断失配。
    themes:
      - kind: 新概念
        title: 生成的质量、记忆与多样性可以分开量
        analysis: 主轨获奖论文在扩散训练中区分了出样质量和记忆出现的时点；数据与基准专轨获奖论文在开放生成中区分了单模型重复和跨模型同质化。两篇论文共同提示，生成得像或看起来好，不等于不复制、也不等于答案多样。这是跨轨论文对读，不是投稿热度统计。
        references:
          - title: Why Diffusion Models Don’t Memorize（主轨）
