        title: 'Every Bit Helps: Achieving the Optimal Distortion with a Few Queries'
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-25-paper-awards/
        paper_url: https://ojs.aaai.org/index.php/AAAI/article/download/33507/35662
        reading: 只知道每个人对备选项的排序，会丢失偏好强弱。论文研究在匹配与社会选择问题中，向每人追加少量数值效用查询，能将最坏情况下的福利损失缩小到什么程度。
      - name: Outstanding Paper Award
        title: Efficient Rectification of Neuro-Symbolic Reasoning Inconsistencies by Abductive Reflection
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-25-paper-awards/
        paper_url: https://www.lamda.nju.edu.cn/publication/hu25aaai.pdf
        reading: 当神经网络的预测与背景知识冲突时，ABL-Refl 通过溯因反思定位并纠正不一致，降低原有一致性优化的开销。
      - name: Outstanding Paper Award
        title: 'Revelations: A Decidable Class of POMDPs with Omega-Regular Objectives'
        award_url: https://aaai.org/about-aaai/aaai-awards/aaai-25-paper-awards/
        paper_url: https://ojs.aaai.org/index.php/AAAI/article/download/34845/37000
        reading: 作者区分两类能反复揭示真实状态的部分可观测决策过程，分析在哪些条件下能判定策略是否以概率一满足给定目标。
    themes:
      - kind: 技术趋势
        title: 用可验证的视觉问题评估生成图像
        analysis: I-HallA 把图像中应当出现的事实拆成视觉问答题。例如，识别出物体之后，还要判断其数量和结构。这样可以定位提示词与图像大体相符时仍然存在的事实错误。
        references:
          - title: Evaluating Image Hallucination in Text-to-Image Generation with Question-Answering
            url: https://ojs.aaai.org/index.php/AAAI/article/download/34827/36982
      - kind: 新模型范式
        title: 用背景知识纠正感知模型的推理
        analysis: ABL-Refl 保留神经模型与符号推理之间的分工，把两者预测不一致的位置作为纠错依据。该机制依赖可供推理的背景知识，应用到其他任务时需先明确哪些约束可表达。
        references:
          - title: Efficient Rectification of Neuro-Symbolic Reasoning Inconsistencies by Abductive Reflection
            url: https://www.lamda.nju.edu.cn/publication/hu25aaai.pdf
      - kind: 新概念
        title: 把两组点之间的对应关系作为去噪对象
        analysis: DiffCorr 研究同一人体或动物姿态大幅变化后，如何找回两幅点云之间相互对应的点。模型从粗略的匹配开始，利用可靠伪标签训练条件扩散模型，逐步修正对应关系。
        references:
          - title: DiffCorr
            url: https://ojs.aaai.org/index.php/AAAI/article/download/32273/34428
