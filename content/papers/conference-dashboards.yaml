        analysis: DiffGen 用可微物理、渲染与视觉语言目标搜索能完成指令的动作序列。DISCOVERSE 将实景外观的三维高斯渲染与 MuJoCo 动力学结合，通过模仿学习检查仿真训练能否迁移到实物。前者关注演示如何产生，后者关注演示与环境的可迁移性。
