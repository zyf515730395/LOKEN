        paper_url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/cbaf319a4712385b5ba8a414808b5713-Abstract-Conference.html
        reading: 两套去噪网络分别在互不重叠的图像集上训练。样本足够多时，它们学到近似相同的分数函数；作者从适应图像局部几何的谐波基解释这一现象。
