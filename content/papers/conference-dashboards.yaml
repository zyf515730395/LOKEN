        paper_url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/0b408293619f725fd30162af057e531a-Abstract-Conference.html
        reading: 作者在视觉 Transformer 特征图的低信息背景中定位到高范数 token。为内部计算加入额外的寄存器 token 后，所测模型的稠密特征图更平滑。
