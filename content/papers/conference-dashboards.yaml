          - title: Fovea Stacking
            url: https://doi.org/10.1145/3763278
      - kind: 新概念
        title: 显式采样不连续边界的梯度
        analysis: 逆渲染遇到遮挡或硬边时，平滑区域的梯度不能替代跳变贡献。该论文以线段采样估计着色器跳变边界；若用于研究清晰轮廓，可将边界误差与平滑区域误差分别测量。
        references:
          - title: Automatic Sampling for Discontinuities in Differentiable Shaders
            url: https://doi.org/10.1145/3763291
