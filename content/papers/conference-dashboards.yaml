        value: 27.5%
        scope: 会议事实表公布的比例，对应 2,609 篇录用和 9,473 篇投稿。
        source_url: https://media.icml.cc/Conferences/ICML2024/ICML2024_Fact_Sheet.pdf
    awards:
      - name: Best Paper
        title: Scaling Rectified Flow Transformers for High-Resolution Image Synthesis
        award_url: https://icml.cc/virtual/2024/awards_detail
        paper_url: https://proceedings.mlr.press/v235/esser24a.html
        reading: 调整训练时采样噪声强度的分布，并为文字和图像使用不同权重、双向交换信息。作者在高分辨率文生图中检验了指令理解和画面内文字生成。
      - name: Best Paper
        title: 'Genie: Generative Interactive Environments'
        award_url: https://icml.cc/virtual/2024/awards_detail
        paper_url: https://proceedings.mlr.press/v235/bruce24a.html
        reading: 从未标注动作的网络视频学习潜在动作。给定起始画面，用户可以逐帧选择动作，让模型生成相应的后续画面。
      - name: Best Paper
        title: 'VideoPoet: A Large Language Model for Zero-Shot Video Generation'
        award_url: https://icml.cc/virtual/2024/awards_detail
        paper_url: https://proceedings.mlr.press/v235/kondratyuk24a.html
        reading: 在同一个只含解码器的 Transformer 中处理视频、图像、音频和文字，用混合自回归任务预训练，再针对视频生成等任务适配。
    themes:
      - kind: 新模型范式
        title: 从视频预测走向可操作的生成环境
        analysis: VideoPoet 让同一序列模型接受多种媒体条件。Genie 增加从视频中学习的动作接口，每一步预测都取决于用户的操作。区分这两类模型时，可看评测是否检验同一起始画面对不同操作的响应。
        references:
          - title: Genie
            url: https://proceedings.mlr.press/v235/bruce24a.html
          - title: VideoPoet
            url: https://proceedings.mlr.press/v235/kondratyuk24a.html
      - kind: 新模型范式
        title: 为图像和文字分别建模，再在生成中交换信息
        analysis: 整流流把数据和噪声沿直线连接。作者同时研究训练时应更常抽取哪些噪声强度，以及图文两路如何交换信息。判断性能来源时，可以分别查看噪声采样和网络结构的消融，再对照画面内文字的生成效果。
        references:
          - title: Scaling Rectified Flow Transformers
            url: https://proceedings.mlr.press/v235/esser24a.html
      - kind: 技术趋势
        title: 高分辨率图像生成中的两种计算取舍
        analysis: HDiT 直接在像素空间训练，将模型的计算量控制在随像素数量线性增长。整流流 Transformer 则调整训练时的噪声采样，并让图文两路共同建模。比较两条路线时要区分高分辨率人脸合成与文本条件生成，两篇论文检验的任务不同。
        references:
          - title: Hourglass Diffusion Transformers
            url: https://proceedings.mlr.press/v235/crowson24a.html
          - title: Scaling Rectified Flow Transformers
            url: https://proceedings.mlr.press/v235/esser24a.html
      - kind: 新概念
        title: 把图像去噪看成向数据流形的近似投影
        analysis: 在流形假设下，加噪近似于沿垂直方向偏离数据，去噪则可解释为对距离函数做梯度下降。作者给出带投影误差假设的 DDIM 收敛分析，并据此改进采样时的梯度估计。
        references:
          - title: Interpreting and Improving Diffusion Models from an Optimization Perspective
            url: https://proceedings.mlr.press/v235/permenter24a.html
