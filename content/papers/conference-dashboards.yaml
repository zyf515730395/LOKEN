      - kind: 新模型范式
        title: 为生成的三维资产指定空间约束
        analysis: 只用提示词很难精确表达物体占据哪一块空间。CLAY 让体素、包围盒、点云等输入直接控制生成过程，提供了比较语义描述、二维参考和三维结构约束的同一实验平台。
        references:
          - title: 'CLAY: A Controllable Large-scale Generative Model for Creating High-quality 3D Assets'
            url: https://arxiv.org/abs/2406.13897
      - kind: 技术趋势
        title: 把大场景辐射场拆成可流式加载的局部模型
        analysis: SMERF 按空间层次划分辐射场，渲染时根据相机位置选择局部模型，从而限制单次访问的内存与计算量。局部模型通过蒸馏保持一致，评估移动端漫游时还可检查相机跨越分区后画面是否跳变。
        references:
          - title: SMERF（ACM 论文）
            url: https://doi.org/10.1145/3658193
