        source_url: https://doi.org/10.1145/3815597
    awards:
      - name: Technical Papers Best Paper Award
        title: "GimmBO: Interactive Generative Image Model Merging via Bayesian Optimization"
        award_url: https://blog.siggraph.org/2026/05/siggraph-2026-technical-papers-awards-best-papers-honorable-mentions-and-test-of-time.html/
        paper_url: https://arxiv.org/abs/2601.18585
        reading: 把图像生成适配器的融合权重当成搜索变量。用户比较生成样张，偏好贝叶斯优化根据选择推荐下一组权重，减少反复拖动滑块的成本。关键是人的反馈如何引导参数搜索，并不是重训底模。
      - name: Technical Papers Best Paper Award
        title: Inverse Rendering for Discrete X-Ray Computed Tomography
        award_url: https://blog.siggraph.org/2026/05/siggraph-2026-technical-papers-awards-best-papers-honorable-mentions-and-test-of-time.html/
        paper_url: https://rgl.epfl.ch/publications/Nuic2026DiscreteCT
        reading: 将每个体素表示为已知材料类别上的概率分布，再用实测投影与可微渲染预测的一致性作梯度反演。支持散射等非线性效应，在论文测试的稀疏投影和有限角度条件下尤其有优势；前提是材料类别已知。
      - name: Technical Papers Best Paper Award
        title: "Walk on Decomposed Subdomains: A Hybrid Monte Carlo-Deterministic Solver for Elliptic PDEs"
        award_url: https://blog.siggraph.org/2026/05/siggraph-2026-technical-papers-awards-best-papers-honorable-mentions-and-test-of-time.html/
        paper_url: https://clementjambon.github.io/wods/
        reading: 把复杂域拆成可处理的子域，用蒙特卡洛估计局部求解算子，再以稀疏线性系统耦合子域边界。把随机采样留给易并行的局部步骤，把全局一致性交给确定性求解。
    themes:
      - kind: 新概念
        title: 反演时，关键是选对未知量与观测
        analysis: 两篇获奖工作是互补例子：GimmBO 的未知量是适配器融合系数，反馈是人的样张偏好；离散 CT 则从物理投影估计已知材质的体素分布。它们的求解器并不通用，但都说明先明确参数和反馈，比直接增加生成或采样预算更有针对性。此处为获奖案例对读，不是全会统计。
        references:
          - title: GimmBO 作者项目
            url: https://gimmbo-project.github.io/
          - title: 离散 CT 逆渲染作者论文
            url: https://rgl.epfl.ch/publications/Nuic2026DiscreteCT

