        source_url: https://asia.siggraph.org/2024/images/pdfs/SIGGRAPH-Asia-2024-Conditionally-Accepted-Technical-Papers.pdf
    awards:
      - name: Best Paper
        title: 'GroomCap: High-Fidelity Prior-Free Hair Capture'
        award_url: https://asia.siggraph.org/2024/for-the-press/press-releases/siggraph-asia-2024-award-winners/
        paper_url: https://syntec-research.github.io/GroomCap/
        reading: 从多视图估计三维头发的局部方向和占据情况，再据此恢复发丝。方法针对真实采集的发型，无需外部发型数据先验。
      - name: Best Paper
        title: 'Quark: Real-time, High-resolution, and General Neural View Synthesis'
        award_url: https://asia.siggraph.org/2024/for-the-press/press-releases/siggraph-asia-2024-award-winners/
        paper_url: https://quark-3d.github.io/
        reading: 给定稀疏 RGB 相机视图或视频流，用前馈网络重建并合成新视角。作者在一张 NVIDIA A100 上报告了 1080p、每秒 30 帧的结果。
      - name: Best Paper Honorable Mention
        title: 'TEXGen: a Generative Diffusion Model for Mesh Textures'
        award_url: https://asia.siggraph.org/2024/for-the-press/press-releases/siggraph-asia-2024-award-winners/
        paper_url: https://cvmi-lab.github.io/TEXGen/
        reading: 直接在网格的 UV 纹理域训练扩散模型，按文本或单视图条件生成纹理。输入网格提供了表面结构，模型负责外观。
    themes:
      - kind: 技术趋势
        title: 从多视图恢复发丝，还是直接生成下一视角
        analysis: GroomCap 输出具有方向的发丝几何，适合检查发缕结构。Quark 将计算集中在实时合成给定视角的图像，主要比较新视图质量和帧率。两者即使输入都含多视图，所需的采集条件、输出和验收指标仍有区别。
        references:
          - title: 'GroomCap: High-Fidelity Prior-Free Hair Capture'
            url: https://syntec-research.github.io/GroomCap/
          - title: 'Quark: Real-time, High-resolution, and General Neural View Synthesis'
            url: https://quark-3d.github.io/
      - kind: 新模型范式
        title: 直接学习网格表面的纹理分布
        analysis: TEXGen 直接在 UV 空间生成纹理，以二维卷积处理纹理图局部细节，并用三维表面上的交互连接 UV 中彼此分离的区域。可沿网格接缝检查连续性，同时对照纹理与文本或参考图的匹配情况。
        references:
          - title: 'TEXGen: a Generative Diffusion Model for Mesh Textures'
            url: https://cvmi-lab.github.io/TEXGen/
      - kind: 新概念
        title: 用光照传输表示可换光的人头化身
        analysis: URAvatar 直接学习入射光如何改变头部外观。模型先从受控采集学到跨人的光照响应，再用未知光照下的个人手机扫描进行适配。读结果时可区分两种成本：训练通用模型需要的受控采集，以及新增一位用户所需的手机采集。
        references:
          - title: 'URAvatar: Universal Relightable Gaussian Codec Avatars'
            url: https://asia.siggraph.org/2024/presentation/?id=papers_796&sess=sess223
  ICML 2024:
    statistics:
      - label: 主赛道投稿
