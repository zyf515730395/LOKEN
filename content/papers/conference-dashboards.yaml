        award_url: https://english.sia.cas.cn/news/Events/202512/t20251212_1136776.html
        paper_url: https://events.infovaya.com/uploads/documents/pdfviewer/80/65/200114-4372.pdf
        reading: 研究用薄膜叉指电极对工程骨骼肌执行器进行局部刺激，并在台架上验证选中肌肉收缩时，邻近肌肉未出现明显收缩。证据支持独立寻址，不等于已验证整机长时运行；疲劳、能耗和耐久仍待评估。
