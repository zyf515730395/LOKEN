        award_url: https://publications.ait.ac.at/en/prizes/iros-best-application-paper-award/
        paper_url: https://doi.org/10.1109/IROS58592.2024.10802255
        reading: 把演示轨迹和沿途的局部表面形状一起编码，让机器人能把沿边擦洗动作迁移到形状不同的水盆。
      - name: Best Paper on Cognitive Robotics
        title: 'BEVCar: Camera-Radar Fusion for BEV Map and Object Segmentation'
        award_url: https://rl.informatik.uni-freiburg.de/news
        paper_url: https://arxiv.org/abs/2403.11761
        reading: 融合相机与雷达，在同一鸟瞰坐标下做地图和物体分割，并按不同照明、天气条件评估。
    themes:
      - kind: 新模型范式
        title: 让雷达引导图像特征进入鸟瞰图
        analysis: BEVCar 从稀疏雷达点学习特征，用雷达信息指导图像特征向鸟瞰空间投影，再融合两种传感器预测道路元素和物体。论文在 nuScenes 上按天气与昼夜拆分评测，可检查整体指标掩盖了哪些场景差异。
        references:
          - title: BEVCar
            url: https://arxiv.org/abs/2403.11761
      - kind: 新概念
        title: 把基础运动当成可组合的控制单元
        analysis: Elementary Dynamic Actions 用网络连接可叠加的动作模块，让同一系统组合出不同的末端运动。作者以机器人手臂的任务检验模块性，区别于为每条完整轨迹单独求解。
        references:
          - title: On the Modularity of Elementary Dynamic Actions
            url: https://doi.org/10.1109/IROS58592.2024.10801502
      - kind: 技术趋势
        title: 让操作动作适应物体几何变化
        analysis: ProSIP 将擦洗轨迹绑定到局部表面，从一种水盆边缘迁移到另一种形状。AO-Grasp 从可见部分的点云预测可用于操作活动部件的抓取姿态，实验包含开合柜门等任务。两项工作都让几何信息参与动作选择，验证的动作阶段各不相同。
        references:
          - title: ProSIP
            url: https://doi.org/10.1109/IROS58592.2024.10802255
          - title: AO-Grasp
            url: https://arxiv.org/abs/2310.15928
  IROS 2026:
    statistics:
      - label: 开幕式公布投稿
        value: 3,970
        scope: IEEE 官方开幕录像 05:24 的 Technical Program Update 投影片，采用当时的技术项目统计。
