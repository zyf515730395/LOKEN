        reading: 用匹配的二元空间分割树生成多个稀疏耦合，再合并以降低传输代价。论文的低误差证据来自特定三维点集实验，方法给出近似传输，不承诺一般情形的精确最优。
    themes:
      - kind: 新模型范式
        title: 在采集时主动获得局部高频
        analysis: Fovea Stacking 用可控光学器件把清晰区域移到所需位置，并利用多帧得到全画面清晰图。与软件超分的区别是它实际采集到新的高频；做对照时应把额外硬件和采集帧数计入预算。
